<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upravljanje Korisnicima</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
    color: #333;
    padding: 30px 40px;
  }

  h2 { color: #2c3e50; margin-bottom: 20px; }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 25px 30px;
    max-width: 640px;
    margin-bottom: 40px;
  }

  .form-group { margin-bottom: 18px; }

  label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
    color: #333;
  }

  input[type="text"],
  input[type="email"],
  select {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    color: #333;
  }

  input::placeholder { color: #999; }

  input:focus, select:focus {
    outline: none;
    border-color: #66afe9;
    box-shadow: 0 0 4px rgba(102, 175, 233, 0.5);
  }

  .btn-primary {
    background-color: #28a745;
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 5px;
  }

  .btn-primary:hover { background-color: #218838; }

  table {
    width: 100%;
    max-width: 640px;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
  }

  thead { background-color: #1a7ef0; color: #fff; }

  th {
    text-align: left;
    padding: 12px 15px;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  td {
    padding: 12px 15px;
    font-size: 14px;
    border-top: 1px solid #eee;
  }

  tbody tr:nth-child(even) { background-color: #f9f9f9; }

  .btn-delete {
    color: #e74c3c;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
  }

  .btn-delete:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="card">
    <h2>Novi Korisnik</h2>
    <form>
      <div class="form-group">
        <label for="ime">Ime i Prezime:</label>
        <input type="text" id="ime" name="ime" placeholder="npr. Ana Anić">
      </div>

      <div class="form-group">
        <label for="email">Email adresa:</label>
        <input type="email" id="email" name="email" placeholder="npr. ana@email.com">
      </div>

      <div class="form-group">
        <label for="uloga">Uloga:</label>
        <select id="uloga" name="uloga">
          <option value="korisnik">Obični korisnik</option>
          <option value="urednik">Urednik</option>
          <option value="administrator">Administrator</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Spremi Korisnika</button>
    </form>
  </div>

  <h2>Lista Korisnika</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Ime i Prezime</th>
        <th>Email</th>
        <th>Uloga</th>
        <th>Akcija</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td><td>Ivan Horvat</td><td>ivan@tvrtka.hr</td>
        <td>Administrator</td><td><a href="#" class="btn-delete">Obriši</a></td>
      </tr>
      <tr>
        <td>2</td><td>Marko Marić</td><td>marko@tvrtka.hr</td>
        <td>Urednik</td><td><a href="#" class="btn-delete">Obriši</a></td>
      </tr>
      <tr>
        <td>3</td><td>Petra Perić</td><td>petra@tvrtka.hr</td>
        <td>Korisnik</td><td><a href="#" class="btn-delete">Obriši</a></td>
      </tr>
      <tr>
        <td>4</td><td>Luka Lukić</td><td>luka@tvrtka.hr</td>
        <td>Korisnik</td><td><a href="#" class="btn-delete">Obriši</a></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
